<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>Picture Story Box</title>
<style>
  :root {
    --bg: #fff8ec; --ink: #3b2a1a; --muted: #8a7560; --card: #ffffff;
    --accent: #ff7a3d; --accent2: #2bb3a3; --curtain: #b3202f; --curtain2: #7d1420;
    --shadow: 0 6px 18px rgba(80, 50, 20, .15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Baloo 2", "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  .hidden { display: none !important; }

  /* ---------- Home ---------- */
  #home { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  #home h1 { font-size: clamp(28px, 7vw, 44px); margin: 8px 0 2px; text-align: center; }
  #home .sub { text-align: center; color: var(--muted); margin: 0 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border-radius: 22px; box-shadow: var(--shadow);
    padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 8px;
    transition: transform .15s;
  }
  .card:active { transform: scale(.97); }
  .card .thumb {
    height: 120px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: 54px; overflow: hidden; background-size: cover; background-position: center;
  }
  .card b { font-size: 20px; }
  .card small { color: var(--muted); }
  .card.make .thumb { background: repeating-linear-gradient(45deg, #ffe3c9, #ffe3c9 12px, #fff1e2 12px, #fff1e2 24px); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill {
    background: var(--card); border-radius: 999px; padding: 8px 14px; box-shadow: var(--shadow); font-size: 16px;
  }
  .pill.on { background: var(--accent); color: #fff; }
  .settings { justify-content: center; margin-bottom: 18px; }
  h2 { margin: 28px 0 12px; font-size: 22px; }
  .del { margin-left: auto; background: none; color: var(--muted); font-size: 14px; padding: 0; }

  /* ---------- Maker ---------- */
  #maker { max-width: 760px; margin: 0 auto; padding: 16px 16px 120px; }
  #maker input[type=text], #maker textarea {
    width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 14px;
    border: 2px solid #f0dcc4; background: #fff; color: var(--ink);
  }
  #maker textarea { min-height: 70px; resize: vertical; }
  .drop {
    display: block; border: 3px dashed #f3b98f; border-radius: 22px; padding: 26px 12px; text-align: center;
    background: #fff3e6; margin: 14px 0; font-size: 18px; cursor: pointer;
  }
  .drop input { display: none; }
  .page { display: grid; grid-template-columns: 110px 1fr; gap: 12px; background: #fff; border-radius: 18px; padding: 10px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .page img { width: 110px; height: 110px; object-fit: cover; border-radius: 12px; }
  .page .tools { display: flex; gap: 6px; margin-top: 6px; }
  .page .tools button { background: #fff1e2; border-radius: 10px; padding: 4px 10px; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(255, 248, 236, .95); display: flex; gap: 10px; justify-content: center; box-shadow: 0 -4px 14px rgba(0,0,0,.08);
  }
  .big { background: var(--accent); color: #fff; border-radius: 999px; padding: 12px 22px; font-size: 18px; box-shadow: var(--shadow); }
  .big.alt { background: var(--accent2); }
  .big.ghost { background: #fff; color: var(--ink); }

  /* ---------- Player ---------- */
  #player { position: fixed; inset: 0; overflow: hidden; background: #000; user-select: none; }
  #stage { position: absolute; inset: 0; transition: background 1s; }
  .sky { position: absolute; inset: 0; }
  .actor {
    position: absolute; transform: translate(-50%, -50%); line-height: 1;
    transition: left 1.6s ease-in-out, top 1.6s ease-in-out, font-size .6s, opacity .6s;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,.25));
  }
  .photo {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    animation: kenburns 9s ease-in-out forwards;
  }
  .photo.fit { background-size: contain; background-repeat: no-repeat; animation-name: kenburns-soft; }
  @keyframes kenburns { from { transform: scale(1.02) translate(0,0); } to { transform: scale(1.14) translate(-2%, -2%); } }
  @keyframes kenburns-soft { from { transform: scale(1); } to { transform: scale(1.06); } }
  .bob { animation: bob 1.4s ease-in-out infinite; }
  .walk { animation: walk .5s ease-in-out infinite; }
  .fly { animation: fly 1.2s ease-in-out infinite; }
  .spin { animation: spin 3s linear infinite; }
  .pulse { animation: pulse 1s ease-in-out infinite; }
  .zzz { animation: zzz 2s ease-out infinite; }
  .shake { animation: shake .4s ease-in-out 3; }
  @keyframes bob { 50% { transform: translate(-50%, -58%); } }
  @keyframes walk { 0%,100% { transform: translate(-50%,-50%) rotate(-4deg); } 50% { transform: translate(-50%,-54%) rotate(4deg); } }
  @keyframes fly { 50% { transform: translate(-50%, -70%) rotate(-6deg); } }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  @keyframes pulse { 50% { transform: translate(-50%,-50%) scale(1.15); } }
  @keyframes zzz { 0% { opacity: 0; transform: translate(-50%,-30%); } 40% { opacity: 1; } 100% { opacity: 0; transform: translate(-10%,-150%); } }
  @keyframes shake { 25% { transform: translate(-54%,-50%); } 75% { transform: translate(-46%,-50%); } }
  .actor.pic { filter: none; }
  .actor.pic img { width: 100%; display: block; pointer-events: none; -webkit-user-drag: none; position: relative;
    filter: saturate(1.08) contrast(1.04); transition: filter .6s; }
  .actor.pic::before { content: ''; position: absolute; left: 8%; right: 8%; bottom: -4%; height: 14%;
    background: radial-gradient(ellipse at center, rgba(30,20,0,.45), rgba(30,20,0,0) 70%); }
  #stage[data-tone=night] .actor.pic img { filter: brightness(.72) saturate(.75) contrast(1.05)
    drop-shadow(0 0 8px rgba(120,255,220,.35)); }
  #stage[data-tone=night] .actor.pic::before { background: radial-gradient(ellipse at center, rgba(0,20,30,.6), rgba(0,20,30,0) 70%); }
  /* picture stories without text: caption becomes a small next/tap button */
  #caption.mini { left: auto; right: 16px; transform: none; width: auto; min-height: 0; padding: 10px 16px;
    font-size: 28px; border-radius: 999px; }
  .actor.flip img { transform: scaleX(-1); }
  .pop { position: absolute; transform: translate(-50%,-50%); font-weight: 800; color: #fff;
    text-shadow: 0 2px 0 #b3202f, 0 0 8px rgba(0,0,0,.4); pointer-events: none; animation: popup 1.2s ease-out forwards; z-index: 4; }
  @keyframes popup { 0% { opacity: 0; transform: translate(-50%,-30%) scale(.6); } 20% { opacity: 1; transform: translate(-50%,-60%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%,-160%) scale(1); } }
  .tapme { cursor: pointer; }
  #caption { display: none !important; }
  #stage.fadein { animation: scenefade 1s ease; }
  @keyframes scenefade { from { opacity: 0; filter: brightness(.3); } to { opacity: 1; filter: none; } }
  #stage .sky { animation: camera 14s ease-out forwards; transform-origin: 50% 70%; }
  @keyframes camera { from { transform: scale(1.0); } to { transform: scale(1.08); } }
  #player::before, #player::after { content: ''; position: absolute; left: 0; right: 0; height: 5vh; background: #000; z-index: 4; pointer-events: none; }
  #player::before { top: 0; } #player::after { bottom: 0; }
  #player.paused #stage { filter: brightness(.6); }
  #player.paused #stage::after { content: '▶'; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 18vmin; color: #fff; text-shadow: 0 4px 20px rgba(0,0,0,.5); z-index: 6; }
  #hud { z-index: 7; }
  .tapme::after {
    content: "👆"; position: absolute; font-size: .35em; right: -10%; bottom: -15%;
    animation: pulse 1s infinite; transform: none;
  }

  .water { position: absolute; background: linear-gradient(#7fd3ff, #2b8fd6); border-radius: 6px 6px 40% 40%; box-shadow: 0 0 0 3px rgba(255,255,255,.5); transition: height .8s ease; }

  #caption {
    position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(92%, 700px); background: rgba(255, 255, 255, .92); color: var(--ink);
    padding: 14px 18px; border-radius: 20px; font-size: clamp(18px, 4.6vw, 26px); line-height: 1.35;
    text-align: center; box-shadow: var(--shadow); min-height: 1.5em;
  }
  #caption .hint { display: block; font-size: .6em; color: var(--muted); margin-top: 4px; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px; z-index: 5;
  }
  #hud .pill { padding: 6px 12px; }
  #hud .grow { flex: 1; }
  #progress { height: 10px; background: rgba(255,255,255,.6); border-radius: 99px; overflow: hidden; }
  #progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s; }
  #counter { min-width: 44px; text-align: center; font-size: 18px; }

  /* Curtain */
  #curtain { position: absolute; inset: 0; z-index: 10; display: flex; cursor: pointer; }
  #curtain .half {
    flex: 1; background: repeating-linear-gradient(90deg, var(--curtain) 0 28px, var(--curtain2) 28px 40px);
    transition: transform 1.3s cubic-bezier(.7,0,.3,1); box-shadow: inset 0 -30px 40px rgba(0,0,0,.3);
  }
  #curtain.open .half:first-child { transform: translateX(-100%); }
  #curtain.open .half:last-child { transform: translateX(100%); }
  #curtain .label {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;
    color: #fff; background: rgba(0,0,0,.35); padding: 18px 26px; border-radius: 24px; transition: opacity .4s;
  }
  #curtain .label b { display: block; font-size: clamp(26px, 7vw, 42px); }
  #curtain.open .label { opacity: 0; }

  #theend {
    position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; gap: 16px;
    align-items: center; justify-content: center; background: rgba(255, 248, 236, .9); text-align: center; padding: 16px;
  }
  #theend h2 { font-size: clamp(38px, 10vw, 64px); margin: 0; }
  #theend .moral { font-size: 20px; max-width: 520px; }
  .confetti { position: absolute; top: -40px; font-size: 26px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<section id="home">
  <h1>📚 Picture Story Box</h1>
  <p class="sub">Tap a story — or make your own from pictures!</p>
  <div class="row settings">
    <button class="pill" data-lang="en">English</button>
    <button class="pill" data-lang="hi">हिंदी</button>
    <button class="pill" id="voiceBtn">🔊 Voice on</button>
  </div>
  <div class="grid" id="builtins"></div>
  <h2>🖼️ My picture stories</h2>
  <div class="grid" id="mine"></div>
</section>

<!-- ================= MAKER ================= -->
<section id="maker" class="hidden">
  <div class="row"><button class="pill" id="makerBack">🏠 Home</button></div>
  <h2>✏️ Make a story from pictures</h2>
  <input type="text" id="mkTitle" placeholder="Story name — e.g. Our trip to the zoo" maxlength="60">
  <label class="drop">📷 Tap to add pictures<br><small>(from camera or gallery — add as many as you like)</small>
    <input type="file" id="mkFiles" accept="image/*" multiple>
  </label>
  <div id="mkPages"></div>
  <label>Ending line (optional)</label>
  <input type="text" id="mkMoral" placeholder="e.g. What a happy day!" maxlength="140">
  <div class="bar">
    <button class="big ghost" id="mkPreview">▶ Preview</button>
    <button class="big" id="mkSave">💾 Save story</button>
  </div>
</section>

<!-- ================= PLAYER ================= -->
<section id="player" class="hidden">
  <div id="stage"></div>
  <div id="hud">
    <button class="pill" id="homeBtn">🏠</button>
    <div class="grow"><div id="progress"><i></i></div></div>
    <span class="pill" id="counter">⭐ 0</span>
  </div>
  <div id="caption"></div>
  <div id="theend" class="hidden">
    <h2>The End 🎉</h2>
    <div class="moral" id="moral"></div>
    <div class="row" style="justify-content:center">
      <button class="big" id="againBtn">🔁 Play again</button>
      <button class="big alt" id="endHome">🏠 Home</button>
    </div>
  </div>
  <div id="curtain">
    <div class="half"></div><div class="half"></div>
    <div class="label"><b>🎬 Story time!</b><span id="curtainTitle"></span><br><small>▶ tap to start the movie</small></div>
  </div>
</section>

<script>
/* =====================================================================
   Story format
   ---------------------------------------------------------------------
   { id, title:{en,hi}, cover, bg, moral:{en,hi}, counter:'⭐',
     scenes: [{
       sky: CSS background,
       actors: [{ id, e: emoji, x:%, y:%, s: size(vmin), cls }],   // placed/moved actors
       text: {en, hi},
       tap: { target: actorId, times: n, hint:{en,hi}, onTap(i, api) }  // optional interaction
     }]}
   Custom (picture) stories use scenes [{ img: dataURL, text }] instead.
   ===================================================================== */

const L = (o) => (typeof o === 'string' ? o : (o[state.lang] || o.en));

const BUILTIN = [
  {
    id: 'tiger', coverImg: 'img/tiger/end_friends.webp', cover: '🐯', bg: '#ffe0a8',
    title: { en: 'The Tiger and the Mouse', hi: 'शेर और चूहा' },
    moral: { en: 'No one is too small to help. Be kind to everyone!', hi: 'कोई भी इतना छोटा नहीं कि मदद न कर सके। सबके साथ अच्छा बनो!' },
    counter: '⭐', goal: 11,
    preload: ['bg_jungle', 'bg_night', 'bg_free', 'bg_morning', 'tiger_sit', 'tiger_sleep', 'tiger_angry', 'tiger_laugh', 'tiger_net', 'tiger_free',
              'mouse_run', 'mouse_scared', 'mouse_gnaw', 'mouse_happy', 'mouse_stand'].map((n) => 'img/tiger/' + n + '.webp'),
    scenes: [
      { sky: 'url(img/tiger/bg_jungle.webp) center/cover',
        actors: [{ id: 'tiger', img: 'tiger_sleep', x: 58, y: 64, s: 66 },
                 { id: 'z', e: '💤', x: 70, y: 52, s: 10, cls: 'zzz' },
                 { id: 'mouse', img: 'mouse_run', x: 14, y: 78, s: 26, cls: 'tapme' }],
        text: { en: 'In a big jungle, a tiger was fast asleep. A tiny mouse came running by…', hi: 'एक बड़े जंगल में एक शेर गहरी नींद में सो रहा था। तभी एक छोटा सा चूहा दौड़ता हुआ आया…' },
        tap: { target: 'mouse', times: 1,
               hint: { en: 'Tap the mouse 🐭', hi: 'चूहे पर टैप करो 🐭' },
               onTap(i, api) {
                 api.move('mouse', 36, 62);
                 setTimeout(() => { api.hide('z'); api.pose('tiger', 'tiger_angry', 60); api.cls('tiger', 'shake'); api.pop('GRRR!', 62, 40); api.pose('mouse', 'mouse_scared', 18); api.move('mouse', 22, 76); }, 1500);
               } } },
      { sky: 'url(img/tiger/bg_jungle.webp) center/cover',
        actors: [{ id: 'tiger', img: 'tiger_angry', x: 62, y: 62, s: 64, cls: 'shake' },
                 { id: 'mouse', img: 'mouse_scared', x: 22, y: 74, s: 20 }],
        text: { en: 'Grrr! The tiger woke up angry. He caught the little mouse with his big paw!', hi: 'ग्ररर! शेर गुस्से में जाग गया। उसने अपने बड़े पंजे से चूहे को पकड़ लिया!' } },
      { sky: 'url(img/tiger/bg_jungle.webp) center/cover',
        actors: [{ id: 'tiger', img: 'tiger_angry', x: 62, y: 62, s: 64 },
                 { id: 'mouse', img: 'mouse_scared', x: 22, y: 74, s: 20, cls: 'tapme' }],
        text: { en: '"Please let me go!" cried the mouse. "One day I will help you too!"', hi: '"मुझे छोड़ दो!" चूहा रोया। "एक दिन मैं भी तुम्हारी मदद करूँगा!"' },
        tap: { target: 'mouse', times: 3,
               hint: { en: 'Tap the mouse to say please 🙏', hi: 'चूहे पर टैप करके "प्लीज़" कहो 🙏' },
               onTap(i, api) { api.pop(['🙏', 'Please!', '🥺'][i - 1], 24, 60); } } },
      { sky: 'url(img/tiger/bg_jungle.webp) center/cover',
        actors: [{ id: 'tiger', img: 'tiger_laugh', x: 62, y: 62, s: 54, cls: 'bob' },
                 { id: 'ha', e: '😂', x: 80, y: 40, s: 10, cls: 'pulse' },
                 { id: 'mouse', img: 'mouse_happy', x: 22, y: 74, s: 22 }],
        after: [{ id: 'mouse', x: -20 }],
        text: { en: 'The tiger laughed: "Ha ha! How can a tiny mouse ever help a big tiger?" But he let the mouse go.', hi: 'शेर हँसा: "हा हा! एक छोटा सा चूहा बड़े शेर की क्या मदद करेगा?" पर उसने चूहे को जाने दिया।' } },
      { sky: 'url(img/tiger/bg_night.webp) center/cover', tone: 'night',
        actors: [{ id: 'tiger', img: 'tiger_net', x: 55, y: 64, s: 66, cls: 'tapme' }],
        text: { en: 'A few days later, the tiger was caught in a hunter\'s rope net! He could not get out.', hi: 'कुछ दिन बाद शेर एक शिकारी के रस्सी के जाल में फँस गया! वह बाहर नहीं निकल पाया।' },
        tap: { target: 'tiger', times: 2,
               hint: { en: 'Tap the tiger to roar for help 🐯', hi: 'शेर पर टैप करो, मदद के लिए दहाड़ो 🐯' },
               onTap(i, api) { api.cls('tiger', 'shake'); api.pop(i === 1 ? 'ROAR!' : 'HELP!', 55, 34); } } },
      { sky: 'url(img/tiger/bg_night.webp) center/cover', tone: 'night',
        actors: [{ id: 'tiger', img: 'tiger_net', x: 62, y: 64, s: 62, cls: 'shake' },
                 { id: 'mouse', img: 'mouse_run', x: -15, y: 78, s: 24 }],
        after: [{ id: 'mouse', x: 24 }],
        text: { en: 'The little mouse heard the roar. "My friend needs help!" He came running fast!', hi: 'छोटे चूहे ने दहाड़ सुनी। "मेरे दोस्त को मदद चाहिए!" वह तेज़ी से दौड़ता हुआ आया!' } },
      { sky: 'url(img/tiger/bg_night.webp) center/cover', tone: 'night',
        actors: [{ id: 'tiger', img: 'tiger_net', x: 62, y: 64, s: 62 },
                 { id: 'mouse', img: 'mouse_gnaw', x: 26, y: 78, s: 32, cls: 'tapme' }],
        text: { en: 'Nibble, nibble! The mouse bit the thick ropes with his sharp teeth.', hi: 'कुतर-कुतर! चूहे ने अपने तेज़ दाँतों से मोटी रस्सियाँ काटीं।' },
        tap: { target: 'mouse', times: 5,
               hint: { en: 'Tap the mouse to bite the rope ✂️', hi: 'रस्सी काटने के लिए चूहे पर टैप करो ✂️' },
               onTap(i, api) {
                 api.cls('mouse', 'shake'); api.pop(i < 5 ? 'nibble!' : 'SNAP!', 34, 66);
                 if (i === 5) setTimeout(() => { api.pose('tiger', 'tiger_free', 60); api.pose('mouse', 'mouse_happy', 22); api.cls('mouse', 'bob'); }, 500);
               } } },
      { sky: 'url(img/tiger/bg_free.webp) center/cover',
        actors: [{ id: 'tiger', img: 'tiger_free', x: 62, y: 62, s: 60, cls: 'bob' },
                 { id: 'mouse', img: 'mouse_happy', x: 22, y: 74, s: 22, cls: 'bob' }],
        text: { en: 'The tiger was free! "Thank you, little friend. I was wrong — even a small friend can be a big help!"', hi: 'शेर आज़ाद हो गया! "धन्यवाद, छोटे दोस्त। मैं गलत था — छोटा दोस्त भी बड़ी मदद कर सकता है!"' } },
      { sky: 'url(img/tiger/bg_morning.webp) center/cover',
        actors: [{ id: 'tiger', img: 'tiger_sit', x: 58, y: 66, s: 58 },
                 { id: 'mouse', img: 'mouse_stand', x: 26, y: 78, s: 24, cls: 'bob' },
                 { id: 'h', e: '💖', x: 40, y: 40, s: 10, cls: 'pulse' },
                 { id: 'b', e: '🦋', x: 82, y: 30, s: 9, cls: 'fly' }],
        text: { en: 'From that day on, the tiger and the mouse were best friends forever.', hi: 'उस दिन से शेर और चूहा हमेशा के लिए पक्के दोस्त बन गए।' } },
    ],
  },
  {
    id: 'crow', cover: '🐦‍⬛', bg: '#ffe7b3',
    title: { en: 'The Thirsty Crow', hi: 'प्यासा कौवा' },

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};

  lang: store.get('psb.lang', 'en'),
  voice: store.get('psb.voice', true),
  mine: store.get('psb.mine', []),
  story: null, idx: 0, score: 0, busy: false, taps: 0, token: 0, paused: false,
};

/* ---------- Speech ---------- */
function speak(text, onDone) {
  // onDone fires once when narration ends (or after an estimated time if there is no voice).
  let fired = false; const t0 = Date.now();
  const est = 600 + text.length * (state.lang === 'hi' ? 85 : 75);
  const done = (minLeft = 0) => { if (fired || !onDone) return; fired = true; setTimeout(onDone, Math.max(0, minLeft)); };
  if (onDone) setTimeout(() => done(), est * 2 + 3000);            // safety net
  if (!state.voice || !('speechSynthesis' in window) || !text) { done(est); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, ''));
  u.onend = () => done(Math.max(0, 1200 - (Date.now() - t0)));
  u.onerror = () => done(Math.max(0, est - (Date.now() - t0)));
  const want = state.lang === 'hi' ? 'hi' : 'en';
  const v = speechSynthesis.getVoices().find((x) => x.lang.toLowerCase().startsWith(want + '-in'))
         || speechSynthesis.getVoices().find((x) => x.lang.toLowerCase().startsWith(want));
  if (v) u.voice = v;
  u.lang = want === 'hi' ? 'hi-IN' : 'en-IN';
  u.rate = 0.9; u.pitch = 1.1;
  speechSynthesis.speak(u);
}
function blip(freq = 660) {
  try {
    const ctx = blip.ctx || (blip.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; o.type = 'triangle';
    g.gain.setValueAtTime(.2, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .25);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .25);
  } catch {}
}

  $('#builtins').innerHTML = '';
  for (const s of BUILTIN) {

    $('#builtins').append(c);
  }
  $('#mine').innerHTML = '';
  const mk = card('➕', state.lang === 'hi' ? 'नई कहानी बनाओ' : 'Make a new story', state.lang === 'hi' ? 'अपनी तस्वीरों से' : 'from your own pictures', () => openMaker());
  mk.classList.add('make');
  $('#mine').append(mk);
  state.mine.forEach((s, i) => {
    const c = card('', s.title || 'My story', s.scenes.length + ' pictures', () => play(s));
    c.querySelector('.thumb').style.backgroundImage = `url(${s.scenes[0]?.img})`;
    const row = document.createElement('div'); row.className = 'row';
    const ed = document.createElement('button'); ed.className = 'del'; ed.textContent = '✏️ Edit';
    ed.onclick = (e) => { e.stopPropagation(); openMaker(i); };

    del.style.marginLeft = '12px';

      e.stopPropagation();
      if (confirm('Delete this story?')) { state.mine.splice(i, 1); store.set('psb.mine', state.mine); renderHome(); }
    };
    row.append(ed, del); c.append(row);
    $('#mine').append(c);
  });
}
function card(emoji, title, sub, onClick) {
  const c = document.createElement('div');
  c.className = 'card'; c.setAttribute('role', 'button'); c.tabIndex = 0;
  c.innerHTML = `<div class="thumb">${emoji}</div><b></b><small></small>`;
  c.querySelector('b').textContent = title; c.querySelector('small').textContent = sub;
  c.onclick = onClick; c.onkeydown = (e) => { if (e.key === 'Enter') onClick(); };
  return c;
}

/* ---------- Maker: create a story from pictures ---------- */
let draft = null, editing = -1;
function openMaker(i = -1) {
  editing = i;
  draft = i >= 0 ? JSON.parse(JSON.stringify(state.mine[i])) : { id: 'my' + Date.now(), custom: true, title: '', moral: '', scenes: [] };
  $('#mkTitle').value = draft.title; $('#mkMoral').value = draft.moral || '';
  renderPages(); show('maker');
}
function renderPages() {
  const box = $('#mkPages'); box.innerHTML = '';
  draft.scenes.forEach((sc, i) => {
    const p = document.createElement('div'); p.className = 'page';
    p.innerHTML = `<img alt=""><div><textarea placeholder="Picture ${i + 1}: what is happening here?"></textarea>
      <div class="tools"><button data-a="up">⬆</button><button data-a="down">⬇</button><button data-a="fit">🔍 Fit</button><button data-a="rm">🗑</button></div></div>`;
    p.querySelector('img').src = sc.img;
    const ta = p.querySelector('textarea'); ta.value = sc.text || '';
    ta.oninput = () => { sc.text = ta.value; };
    p.querySelector('[data-a=fit]').textContent = sc.fit ? '🔍 Fit ✓' : '🔍 Fit';
    p.querySelectorAll('.tools button').forEach((b) => b.onclick = () => {
      const a = b.dataset.a, s = draft.scenes;
      if (a === 'rm') s.splice(i, 1);
      if (a === 'up' && i > 0) [s[i - 1], s[i]] = [s[i], s[i - 1]];
      if (a === 'down' && i < s.length - 1) [s[i + 1], s[i]] = [s[i], s[i + 1]];
      if (a === 'fit') sc.fit = !sc.fit;
      renderPages();
    });
    box.append(p);
  });
}
// Shrink each photo so stories fit in browser storage.
function shrink(file, max = 960) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
$('#mkFiles').onchange = async (e) => {
  for (const f of e.target.files) {
    try { draft.scenes.push({ img: await shrink(f), text: '' }); } catch {}
  }
  e.target.value = ''; renderPages();
};

  draft.title = $('#mkTitle').value.trim() || 'My story';
  draft.moral = $('#mkMoral').value.trim();

}

let fromMaker = false;
function play(story, preview = false) {
  fromMaker = preview;
  state.story = story; state.idx = 0; state.score = 0; state.paused = false; state.token++;
  (story.preload || []).forEach((u) => { const i = new Image(); i.src = u; });
  $('#theend').classList.add('hidden');
  $('#curtainTitle').textContent = story.custom ? story.title : L(story.title);
  $('#curtain').classList.remove('open', 'hidden');
  $('#stage').innerHTML = ''; $('#caption').textContent = '';
  updateHud(); show('player');
}
$('#curtain').onclick = () => {
  const c = $('#curtain'); if (c.classList.contains('open')) return;
  c.classList.add('open'); blip(520);
  setTimeout(() => c.classList.add('hidden'), 1300);
  speechSynthesis?.speak?.(new SpeechSynthesisUtterance(''));   // unlock voice on this tap (mobile)
  renderScene();
};
function updateHud() {
  const s = state.story; if (!s) return;
  const pct = Math.round((state.idx / s.scenes.length) * 100);
  $('#progress i').style.width = pct + '%';
  $('#counter').textContent = state.paused ? '▶' : '⏸';
}

const imgPath = (n) => (n.includes('/') ? n : 'img/tiger/' + n + '.webp');
const api = {
  actor: (id) => $('#stage').querySelector(`[data-id="${id}"]`),
  move(id, x, y) { const a = api.actor(id); if (!a) return; a.style.left = x + '%'; if (y != null) a.style.top = y + '%'; },
  swap(id, e, s, y) { const a = api.actor(id); if (!a) return; a.textContent = e; a.style.fontSize = s + 'vmin'; if (y != null) a.style.top = y + '%'; },
  pose(id, name, w) { const a = api.actor(id); if (!a) return; const im = a.querySelector('img'); if (im) im.src = imgPath(name); if (w) a.style.width = w + 'vmin'; },
  hide(id) { const a = api.actor(id); if (a) a.style.opacity = 0; },
  cls(id, c) { const a = api.actor(id); if (!a) return; a.classList.remove('shake', 'bob', 'walk', 'pulse'); void a.offsetWidth; a.classList.add(c); },
  pop(text, x, y) {
    const p = document.createElement('div'); p.className = 'pop'; p.textContent = text;
    Object.assign(p.style, { left: x + '%', top: y + '%', fontSize: '9vmin' });
    $('#stage').append(p); setTimeout(() => p.remove(), 1300);
  },
  setWater(f) { const w = $('#stage .water'); if (w) w.style.height = (2 + f * 11) + '%'; },
  flyPebble() {
    const p = document.createElement('div'); p.className = 'actor'; p.textContent = '🪨';
    Object.assign(p.style, { left: '84%', top: '66%', fontSize: '7vmin' });
    $('#stage').append(p);
    requestAnimationFrame(() => requestAnimationFrame(() => { p.style.left = '55%'; p.style.top = '52%'; }));
    setTimeout(() => { p.style.opacity = 0; }, 1400); setTimeout(() => p.remove(), 2100);
  },
  rain() {
    for (let k = 0; k < 6; k++) {
      const d = document.createElement('div'); d.className = 'confetti'; d.textContent = '💧';
      d.style.left = (48 + Math.random() * 24) + '%'; d.style.top = '28%';
      d.style.animationDuration = (1 + Math.random()) + 's'; d.style.fontSize = '20px';
      $('#stage').append(d); setTimeout(() => d.remove(), 2200);
    }
  },
};

/* Movie mode: every scene plays by itself. Voice narrates, the action happens, then the next scene. */
const later = (fn, ms) => { const tok = state.token; setTimeout(() => { if (tok === state.token && !state.paused) fn(); }, ms); };
function narrate(text, then) { const tok = state.token; speak(text, () => { if (tok === state.token && !state.paused) then(); }); }
function runScene() {
  const s = state.story, sc = s.scenes[state.idx];
  const text = s.custom ? (sc.text || '') : L(sc.text);
  narrate(text, () => {
    let left = sc.tap ? sc.tap.times - state.taps : 0;
    const step = () => {
      if (left-- > 0) { doTap(sc); later(step, 950); }
      else later(() => next(true), sc.tap ? 2400 : 900);
    };
    step();
  });
}
function doTap(sc) {
  if (state.taps >= sc.tap.times) return;
  state.taps++; state.score++; blip(500 + state.taps * 80);
  sc.tap.onTap(state.taps, api); updateHud();
}
function togglePause() {
  if (!state.story || !$('#curtain').classList.contains('open') || !$('#theend').classList.contains('hidden')) return;
  state.paused = !state.paused; state.token++;
  $('#counter').textContent = state.paused ? '▶' : '⏸';
  $('#player').classList.toggle('paused', state.paused);
  if (state.paused) speechSynthesis?.cancel?.(); else renderScene();
}
function renderScene() {
  const s = state.story, sc = s.scenes[state.idx], stage = $('#stage');
  state.token++;
  stage.innerHTML = '';
  stage.classList.remove('fadein'); void stage.offsetWidth; stage.classList.add('fadein');
  state.taps = 0; state.busy = false;
  if (s.custom) {
    stage.style.background = '#111'; stage.dataset.tone = '';
    const ph = document.createElement('div'); ph.className = 'photo' + (sc.fit ? ' fit' : '');
    ph.style.backgroundImage = `url(${sc.img})`;
    stage.append(ph);
  } else {
    stage.style.background = '';
    stage.dataset.tone = sc.tone || '';
    const sky = document.createElement('div'); sky.className = 'sky'; sky.style.background = sc.sky; stage.append(sky);
    if (sc.water) {
      const w = document.createElement('div'); w.className = 'water';
      Object.assign(w.style, { left: '50%', width: '10%', bottom: '34%', height: '2%' });
      w.style.zIndex = 2; w.style.opacity = .85;
      stage.append(w);
    }
    for (const a of sc.actors) {
      const el = document.createElement('div');
      el.className = 'actor ' + (a.cls || '').replace('tapme', ''); el.dataset.id = a.id;
      if (a.img) {
        el.classList.add('pic');
        const im = document.createElement('img'); im.alt = ''; im.src = imgPath(a.img); el.append(im);
        Object.assign(el.style, { left: a.x + '%', top: a.y + '%', width: a.s + 'vmin', fontSize: '12vmin' });
      } else {
        el.textContent = a.e;
        Object.assign(el.style, { left: a.x + '%', top: a.y + '%', fontSize: a.s + 'vmin' });
      }
      stage.append(el);
    }
    if (sc.after) later(() => sc.after.forEach((m) => api.move(m.id, m.x, m.y)), 400);
  }
  updateHud();
  runScene();
}
function setCaption(text, hint) {
  const c = $('#caption');
  const mini = true;   // no on-screen text: stories are told by voice only
  c.classList.toggle('mini', !!mini);
  if (mini) { c.textContent = /tap|टैप/i.test(hint) && !/next|आगे/.test(hint) ? '👆' : '▶'; c.title = text; return; }
  c.textContent = text;
  const h = document.createElement('span'); h.className = 'hint'; h.textContent = hint; c.append(h);
  c.classList.toggle('hidden', !text && !hint);
}
function next() {
  const s = state.story; if (!s || !$('#curtain').classList.contains('open')) return;
  if (!$('#theend').classList.contains('hidden')) return;
  state.idx++;
  if (state.idx >= s.scenes.length) return theEnd();
  renderScene();
}
function theEnd() {
  updateHud();
  const s = state.story;
  const moral = s.custom ? (s.moral || '') : L(s.moral);
  $('#moral').textContent = moral;
  $('#theend').classList.remove('hidden');
  speak((state.lang === 'hi' ? 'समाप्त! ' : 'The end! ') + moral);
  const set = s.custom ? ['⭐', '🎈', '💖'] : ['⭐', '🎉', s.cover];
  for (let k = 0; k < 30; k++) {
    const d = document.createElement('div'); d.className = 'confetti';
    d.textContent = set[k % set.length]; d.style.left = Math.random() * 100 + '%';
    d.style.animationDuration = (2 + Math.random() * 2) + 's'; d.style.animationDelay = Math.random() + 's';
    $('#theend').append(d); setTimeout(() => d.remove(), 5000);
  }
}
function exitPlayer() {
  state.token++; speechSynthesis?.cancel?.();
  if (fromMaker) show('maker'); else { renderHome(); show('home'); }
}
$('#stage').onclick = togglePause;
$('#counter').onclick = togglePause;
$('#homeBtn').onclick = exitPlayer;
$('#endHome').onclick = exitPlayer;
$('#againBtn').onclick = () => play(state.story, fromMaker);
document.addEventListener('keydown', (e) => {
  if ($('#player').classList.contains('hidden')) return;
  if (e.key === ' ') { e.preventDefault(); $('#curtain').classList.contains('open') ? togglePause() : $('#curtain').click(); }
  if (e.key === 'Escape') exitPlayer();
});
// Swipe up / left to advance, like a reel.
let y0 = null, x0 = null;
$('#player').addEventListener('touchstart', (e) => { y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; }, { passive: true });
$('#player').addEventListener('touchend', (e) => {
  if (y0 == null) return;
  const dy = y0 - e.changedTouches[0].clientY, dx = x0 - e.changedTouches[0].clientX;
  if (Math.max(dy, dx) > 60 && !state.paused) { state.token++; speechSynthesis?.cancel?.(); next(); }
  y0 = x0 = null;
}, { passive: true });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

renderHome();
</script>
</body>
</html>
